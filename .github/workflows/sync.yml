name: Sync Fork

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync upstream changes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const result = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'master'
              });
              console.log('✓ Upstream sync completed successfully');
              console.log('Message:', result.data.message);
            } catch (error) {
              if (error.message.includes('No commits to merge')) {
                console.log('ℹ No upstream commits to merge - fork is up to date');
              } else if (error.message.includes('409')) {
                console.log('⚠ Merge conflict detected - manual intervention may be needed');
                throw error;
              } else {
                console.log('ℹ Sync status:', error.message);
              }
            }

      - name: Notify sync status
        if: always()
        run: |
          echo "Sync workflow completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
